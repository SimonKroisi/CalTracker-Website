# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Internal working files (SEO research, agent skills, full feature doc)
      # stay in the repo but must not be served on caltracker.eu.
      # .well-known/ must NOT be stripped (App/Universal Links).
      - name: Strip non-public files
        run: rm -rf seo .claude CALTRACKER_FEATURES.md .gitignore
      # Upload repository minus the files stripped above — inkl. .well-known/
      # (apple-app-site-association, assetlinks.json für die App-Links).
      # upload-pages-artifact@v3 nimmt versteckte Ordner noch mit; ab v4 würde
      # es .well-known/ weglassen und die Universal/App Links still brechen —
      # nicht ohne Gegenmaßnahme upgraden.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
